name: Build Electron Windows

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare bundled binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp.exe"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "$env:RUNNER_TEMP/ffmpeg.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP/ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP/ffmpeg" -Force
          $ffmpeg = Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe was not found." }
          Copy-Item $ffmpeg.FullName "bin/ffmpeg.exe"
      - name: Install dependencies
        run: npm install
      - name: Build installers
        run: npm run build
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-downloader-windows
          path: |
            dist/*.exe
            dist/*.msi
          if-no-files-found: error
      - name: Publish clean dist branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist/*.exe" | Where-Object { $_.Name -notlike "*blockmap*" } | Select-Object -First 1
          $msi = Get-ChildItem "dist/*.msi" | Select-Object -First 1
          if (-not $exe -or -not $msi) { throw "Installers were not found." }
          $publishDir = Join-Path $env:RUNNER_TEMP "dist-publish"
          Remove-Item $publishDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $publishDir | Out-Null
          Copy-Item $exe.FullName (Join-Path $publishDir "YT-DLP-Downloader.exe")
          Copy-Item $msi.FullName (Join-Path $publishDir "YT-DLP-Downloader.msi")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dist
          git checkout dist
          git rm -r --ignore-unmatch .
          git clean -fdx
          Copy-Item (Join-Path $publishDir "YT-DLP-Downloader.exe") .
          Copy-Item (Join-Path $publishDir "YT-DLP-Downloader.msi") .
          @("# YT-DLP Downloader", "", "Latest Windows Electron build generated from the main branch.") | Set-Content -Path "README.md"
          git add --all
          git commit -m "chore: rebuild dist artifacts"
          git push --force origin HEAD:dist
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.msi
