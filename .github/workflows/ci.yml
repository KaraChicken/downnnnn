name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm install

      - name: Prepare bundled binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          if (-not (Test-Path "bin/yt-dlp.exe")) {
            Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp.exe"
          }
          if (-not (Test-Path "bin/ffmpeg.exe")) {
            Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "$env:RUNNER_TEMP/ffmpeg.zip"
            Expand-Archive -Path "$env:RUNNER_TEMP/ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP/ffmpeg" -Force
            $ffmpeg = Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
            if (-not $ffmpeg) { throw "ffmpeg.exe was not found in the downloaded archive." }
            Copy-Item $ffmpeg.FullName "bin/ffmpeg.exe"
          }
          Get-ChildItem bin

      - name: Prepare isolated frontend assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Copy-Item index.html build/index.html -Force
          Copy-Item src build/src -Recurse -Force

      - name: Build Tauri application
        run: npm run tauri build

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-downloader-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish clean dist branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $msi -or -not $nsis) { throw "Tauri installers were not found." }

          # Save only the two compiled installers outside the repository.
          $publishDir = Join-Path $env:RUNNER_TEMP "dist-publish"
          Remove-Item $publishDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $publishDir | Out-Null
          Copy-Item $msi.FullName (Join-Path $publishDir "YT-DLP-Downloader.msi")
          Copy-Item $nsis.FullName (Join-Path $publishDir "YT-DLP-Downloader.exe")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin dist
          git checkout dist

          # Completely remove everything currently tracked or untracked
          # from the dist branch before publishing the new build.
          git rm -r --ignore-unmatch .
          git clean -fdx

          Copy-Item (Join-Path $publishDir "YT-DLP-Downloader.msi") .
          Copy-Item (Join-Path $publishDir "YT-DLP-Downloader.exe") .
          Set-Content -Path "README.md" -Value ("# YT-DLP Downloader" + [Environment]::NewLine + [Environment]::NewLine + "Latest Windows build generated from the main branch." + [Environment]::NewLine)

          git add --all
          git commit -m "chore: rebuild dist artifacts"
          git push --force origin HEAD:dist

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
