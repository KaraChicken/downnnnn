<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>YT-DLP Downloader</title><link rel="stylesheet" href="./src/style.css"></head><body><main class="app"><header class="topbar"><div class="brand"><span class="brand-mark">↓</span><div><strong>YT-DLP Downloader</strong><small>Electron Desktop Downloader</small></div></div></header><section class="hero"><div class="eyebrow">DOWNLOAD MEDIA</div><h1>把影片帶回本機。</h1><p>貼上支援的網址，解析資訊後選擇格式與儲存位置。</p><div class="url-row"><input id="urlInput" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off"><button id="analyzeBtn" class="primary">解析</button></div><div id="status" class="status">就緒</div></section><section id="videoCard" class="video-card hidden"><img id="thumbnail" alt="影片縮圖"><div class="video-meta"><h2 id="title">—</h2><div class="meta-line"><span id="channel">—</span><span id="duration">—</span></div><div id="videoId" class="muted">—</div></div></section><section id="downloadPanel" class="panel hidden"><div class="field"><label for="format">下載格式</label><select id="format"><option value="best">最佳畫質（影片 + 音訊）</option><option value="1080">1080p</option><option value="720">720p</option><option value="480">480p</option><option value="360">360p</option><option value="audio">僅音訊（M4A）</option><option value="mp3">僅音訊（MP3）</option></select></div><div class="field"><label>儲存位置</label><div class="path-row"><input id="outputDir" readonly placeholder="請選擇資料夾"><button id="folderBtn" class="secondary">選擇</button></div></div><button id="downloadBtn" class="download">開始下載</button></section><section id="progressPanel" class="panel hidden"><div class="progress-head"><strong id="progressText">下載中…</strong><span id="percent">0%</span></div><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div><div class="stats"><span id="speed">—</span><span id="size">—</span><span id="eta">—</span></div><button id="cancelBtn" class="danger">取消下載</button></section><section id="logPanel" class="panel log-panel"><div class="panel-title"><strong>活動記錄</strong><button id="clearLog" class="text-btn">清除</button></div><pre id="log"></pre></section><footer>請確認你對所下載內容具有合法使用權限。yt-dlp 與 FFmpeg 需依各自授權條款使用。</footer></main><script src="./src/app.js"></script></body></html>
